<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produto | RADIOGALAXIA</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪐</text></svg>">
</head>
<body>
    <header class="header header--scrolled" id="header">
        <div class="header__top-bar"><p class="header__top-text">Frete grátis Brasil • Cupom <span>COSMOS10</span></p></div>
        <nav class="nav" id="nav">
            <div class="nav__container">
                <a href="index.html" class="nav__logo"><span class="nav__logo-icon">◆</span><span>RADIO<span class="nav__logo-highlight">GALAXIA</span></span></a>
                <ul class="nav__menu" id="navMenu">
                    <li><a href="index.html" class="nav__link">Início</a></li>
                    <li><a href="produtos.html" class="nav__link">Loja</a></li>
                    <li><a href="sobre.html" class="nav__link">Sobre</a></li>
                    <li><a href="contato.html" class="nav__link">Contato</a></li>
                    <li><a href="faq.html" class="nav__link">FAQ</a></li>
                </ul>
                <div class="nav__actions">
                    <a href="favoritos.html" class="nav__icon-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg><span class="nav__badge" id="favBadge">0</span></a>
                    <a href="carrinho.html" class="nav__icon-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg><span class="nav__badge" id="cartBadge">0</span></a>
                    <button class="nav__hamburger" id="hamburger"><span></span><span></span><span></span></button>
                </div>
            </div>
        </nav>
    </header>

    <main style="padding-top:130px;">
        <section class="section">
            <div class="container" id="produtoContainer">
                <div style="text-align:center;padding:60px;">Carregando produto...</div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer__bottom container" style="border-top:none;padding-top:40px;">
            <p>&copy; 2026 RADIOGALAXIA.</p>
        </div>
    </footer>
    <div class="toast-container" id="toastContainer"></div>

    <script src="js/produtos.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/favoritos.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const produtoId = parseInt(urlParams.get('id'));
            const produtos = window.RADIOGALAXIA?.produtos || [];
            const produto = produtos.find(p => p.id === produtoId);
            const container = document.getElementById('produtoContainer');

            if (!produto) {
                container.innerHTML = '<div style="text-align:center;padding:60px;"><h2>Produto não encontrado</h2><a href="produtos.html" class="btn btn--primary mt-20">Ver Loja</a></div>';
                return;
            }

            const isFav = window.RADIOGALAXIA?.favorites?.isFavorite(produto.id) || false;
            const desconto = produto.precoAntigo ? Math.round((1 - produto.preco / produto.precoAntigo) * 100) : 0;

            container.innerHTML = `
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:start;">
                    <div style="aspect-ratio:3/4;background:linear-gradient(135deg,#1a1a2e,#16213e);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:10rem;">${produto.emoji}</div>
                    <div>
                        <p style="color:#c0c0c0;letter-spacing:2px;text-transform:uppercase;font-size:0.8rem;">${produto.categoria}</p>
                        <h1 style="font-family:'Orbitron',sans-serif;font-size:2.2rem;margin-bottom:10px;">${produto.nome}</h1>
                        <div style="display:flex;align-items:center;gap:12px;margin-bottom:15px;">
                            ${desconto > 0 ? `<span style="text-decoration:line-through;color:#888;font-size:1.2rem;">R$${produto.precoAntigo.toFixed(2)}</span>` : ''}
                            <span style="font-size:2rem;font-weight:700;color:#a78bfa;">R$${produto.preco.toFixed(2)}</span>
                            ${desconto > 0 ? `<span style="background:#8b5cf6;color:white;padding:4px 10px;border-radius:20px;">-${desconto}%</span>` : ''}
                        </div>
                        <p style="color:#888;">ou 3x de R$${(produto.preco/3).toFixed(2)}</p>
                        <p style="color:#e0e0e0;margin:20px 0;">${produto.descricao}</p>
                        <div style="margin-bottom:15px;"><strong>Cor:</strong><div style="display:flex;gap:8px;margin-top:8px;">${produto.cores.map((c,i)=>`<button class="btn btn--sm btn--outline cor-btn" data-cor="${c}" style="${i===0?'border-color:#8b5cf6;':''}">${c}</button>`).join('')}</div></div>
                        <div style="margin-bottom:15px;"><strong>Tamanho:</strong><div style="display:flex;gap:8px;margin-top:8px;">${produto.tamanhos.map((t,i)=>`<button class="btn btn--sm btn--outline tam-btn" data-tam="${t}" style="${i===0?'border-color:#8b5cf6;':''}">${t}</button>`).join('')}</div></div>
                        <div style="display:flex;align-items:center;gap:15px;margin-bottom:15px;">
                            <div style="display:flex;align-items:center;gap:8px;background:#1a1a1a;border-radius:30px;padding:4px;">
                                <button class="btn btn--sm qty-minus" style="padding:4px 10px;">−</button>
                                <span class="qty-num" style="width:30px;text-align:center;">1</span>
                                <button class="btn btn--sm qty-plus" style="padding:4px 10px;">+</button>
                            </div>
                            <span style="color:#888;">Estoque: ${produto.estoque}</span>
                        </div>
                        <button class="btn btn--primary btn--block add-cart-btn">🛒 Adicionar ao Carrinho</button>
                        <button class="btn btn--outline btn--block mt-20 fav-btn">${isFav ? '♥ Remover dos Favoritos' : '♡ Adicionar aos Favoritos'}</button>
                    </div>
                </div>`;

            let qty = 1, selCor = produto.cores[0], selTam = produto.tamanhos[0];
            container.querySelectorAll('.cor-btn').forEach(b => b.addEventListener('click', function() {
                container.querySelectorAll('.cor-btn').forEach(x => x.style.borderColor='#333');
                this.style.borderColor='#8b5cf6'; selCor = this.dataset.cor;
            }));
            container.querySelectorAll('.tam-btn').forEach(b => b.addEventListener('click', function() {
                container.querySelectorAll('.tam-btn').forEach(x => x.style.borderColor='#333');
                this.style.borderColor='#8b5cf6'; selTam = this.dataset.tam;
            }));
            container.querySelector('.qty-minus').addEventListener('click', () => { if(qty>1) { qty--; container.querySelector('.qty-num').textContent = qty; } });
            container.querySelector('.qty-plus').addEventListener('click', () => { if(qty<produto.estoque) { qty++; container.querySelector('.qty-num').textContent = qty; } });
            container.querySelector('.add-cart-btn').addEventListener('click', () => {
                window.RADIOGALAXIA?.cart?.addItem(produto, qty, selCor, selTam);
                showToast(`${produto.nome} adicionado!`);
            });
            container.querySelector('.fav-btn').addEventListener('click', function() {
                const isNowFav = window.RADIOGALAXIA?.favorites?.toggle(produto.id);
                this.textContent = isNowFav ? '♥ Remover dos Favoritos' : '♡ Adicionar aos Favoritos';
                showToast(isNowFav ? 'Favoritado!' : 'Removido.');
            });
        });
    </script>
</body>
</html>
