    <meta charset="UTF-8">

<body>

        <div class="header__top-bar">
            <p class="header__top-text">Frete grátis Brasil em pedidos acima de R$299 • Cupom <span>COSMOS10</span></p>
        </div>
        <nav class="nav" id="nav">
            <div class="nav__container">
                <a href="index.html" class="nav__logo"><span class="nav__logo-icon">◆</span><span>RADIO<span class="nav__logo-highlight">GALAXIA</span></span></a>
                <ul class="nav__menu" id="navMenu">
                    <li><a href="index.html" class="nav__link">Início</a></li>
                    <li><a href="produtos.html" class="nav__link nav__link--active">Loja</a></li>
                    <li><a href="sobre.html" class="nav__link">Sobre</a></li>
                    <li><a href="contato.html" class="nav__link">Contato</a></li>
                    <li><a href="faq.html" class="nav__link">FAQ</a></li>
                </ul>
                <div class="nav__actions">
                    <button class="nav__icon-btn" id="searchToggle" aria-label="Buscar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg></button>
                    <a href="favoritos.html" class="nav__icon-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg><span class="nav__badge" id="favBadge">0</span></a>
                    <a href="carrinho.html" class="nav__icon-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg><span class="nav__badge" id="cartBadge">0</span></a>
                    <button class="nav__hamburger" id="hamburger"><span></span><span></span><span></span></button>
                </div>
            </div>
            <div class="search-bar" id="searchBar">
                <div class="search-bar__container">
                    <input type="text" class="search-bar__input" id="searchInput" placeholder="Buscar produtos...">
                    <button class="search-bar__close" id="searchClose">&times;</button>
                </div>
                <div class="search-bar__results" id="searchResults"></div>
            </div>
        </nav>
    </header>

    <main style="padding-top:130px;">
        <section class="section">
            <div class="container">
                <h1 class="section__title">Loja <span>Cósmica</span></h1>
                <div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:30px;justify-content:center;" id="filterBtns"></div>
                <div style="display:flex;justify-content:flex-end;margin-bottom:20px;gap:10px;align-items:center;">
                    <span style="color:#888;font-size:0.9rem;">Ordenar:</span>
                    <select id="sortSelect" style="background:#1a1a1a;color:white;border:1px solid #333;padding:8px 15px;border-radius:20px;">
                        <option value="relevancia">Mais Relevantes</option>
                        <option value="menor-preco">Menor Preço</option>
                        <option value="maior-preco">Maior Preço</option>
                        <option value="lancamentos">Lançamentos</option>
                    </select>
                </div>
                <div class="products__grid" id="productsGrid"></div>
                <p id="noResults" style="text-align:center;color:#888;display:none;">Nenhum produto nesta categoria.</p>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer__bottom container" style="border-top:none;padding-top:40px;">
            <p>&copy; 2026 RADIOGALAXIA. Todos os direitos reservados.</p>
        </div>
    </footer>
    <div class="toast-container" id="toastContainer"></div>

    <script src="js/produtos.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/favoritos.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const produtos = window.RADIOGALAXIA?.produtos || [];
            const categorias = ['todos','camisetas','moletons','jaquetas','shorts','bones','acessorios'];
            document.getElementById('filterBtns').innerHTML = categorias.map(c =>
                `<button class="filter-btn btn btn--sm btn--outline ${c==='todos'?'active':''}" data-cat="${c}">${c.charAt(0).toUpperCase()+c.slice(1)}</button>`
            ).join('');
            let catAtiva = 'todos', ordenacao = 'relevancia';

            function updateGrid() {
                let prods = [...produtos];
                if (catAtiva !== 'todos') prods = prods.filter(p => p.categoria === catAtiva || p.colecao === catAtiva);
                switch(ordenacao) {
                    case 'menor-preco': prods.sort((a,b)=>a.preco-b.preco); break;
                    case 'maior-preco': prods.sort((a,b)=>b.preco-a.preco); break;
                    case 'lancamentos': prods.sort((a,b)=>(b.lancamento?1:0)-(a.lancamento?1:0)); break;
                }
                const grid = document.getElementById('productsGrid');
                const noRes = document.getElementById('noResults');
                if (prods.length===0) { grid.innerHTML=''; noRes.style.display='block'; }
                else { noRes.style.display='none'; grid.innerHTML = prods.map(p => window.RADIOGALAXIA.renderProductCard(p)).join(''); }
            }

            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
                    this.classList.add('active');
                    catAtiva = this.dataset.cat;
                    updateGrid();
                });
            });
            document.getElementById('sortSelect').addEventListener('change', function(e) { ordenacao = e.target.value; updateGrid(); });
            updateGrid();
        });
    </script>
</body>
          </html>
